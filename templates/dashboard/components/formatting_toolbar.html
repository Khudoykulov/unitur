<script>
document.addEventListener("DOMContentLoaded", function() {
  function attachToolbars() {
    document.querySelectorAll("textarea").forEach(function(textarea) {
      if (textarea.dataset.hasToolbar) return;
      textarea.dataset.hasToolbar = "true";

      const toolbar = document.createElement("div");
      toolbar.className = "flex items-center gap-1.5 p-1.5 bg-slate-100 border border-slate-200 border-b-0 rounded-t-lg text-xs font-semibold text-slate-700 flex-wrap my-1";
      toolbar.innerHTML = `
        <span class="text-[11px] text-slate-500 font-normal mr-1 flex items-center gap-1">
          <i class="ti ti-edit text-xs text-slate-400"></i> Matn formati:
        </span>
        <button type="button" data-tag="b" class="px-2 py-1 bg-white hover:bg-slate-200 border border-slate-300 rounded font-bold transition cursor-pointer shadow-2xs" title="Qalin matn (Bold)"><b>B</b> Qalin</button>
        <button type="button" data-tag="i" class="px-2 py-1 bg-white hover:bg-slate-200 border border-slate-300 rounded italic transition cursor-pointer shadow-2xs" title="Yotiq matn (Italic)"><i>I</i> Yotiq</button>
        <button type="button" data-tag="u" class="px-2 py-1 bg-white hover:bg-slate-200 border border-slate-300 rounded underline transition cursor-pointer shadow-2xs" title="Ostiga chizilgan (Underline)"><u>U</u> Ostki</button>
        <button type="button" data-tag="border" class="px-2 py-1 bg-emerald-50 text-emerald-800 hover:bg-emerald-100 border border-emerald-300 rounded font-bold transition cursor-pointer shadow-2xs flex items-center gap-1" title="Ramkaga olish (Border box)">
          <i class="ti ti-border-all text-xs"></i> 🔲 Ramka (Border)
        </button>
        <button type="button" data-tag="mark" class="px-2 py-1 bg-amber-50 text-amber-800 hover:bg-amber-100 border border-amber-300 rounded font-bold transition cursor-pointer shadow-2xs flex items-center gap-1" title="Sariq fonda ajratish (Highlight)">
          <i class="ti ti-highlight text-xs"></i> 🖍 Ajratish
        </button>
        <button type="button" data-tag="bullet" class="px-2 py-1 bg-white hover:bg-slate-200 border border-slate-300 rounded transition cursor-pointer shadow-2xs" title="Nuqtali ro'yxat (Bullet list)">• Ro'yxat</button>
      `;

      textarea.parentNode.insertBefore(toolbar, textarea);
      textarea.classList.add("rounded-t-none");

      toolbar.querySelectorAll("button").forEach(function(btn) {
        btn.addEventListener("click", function(e) {
          e.preventDefault();
          const start = textarea.selectionStart;
          const end = textarea.selectionEnd;
          const val = textarea.value;
          const selected = val.substring(start, end) || "matn";
          const tag = btn.dataset.tag;

          let replacement = "";
          if (tag === "b") replacement = "<b>" + selected + "</b>";
          else if (tag === "i") replacement = "<i>" + selected + "</i>";
          else if (tag === "u") replacement = "<u>" + selected + "</u>";
          else if (tag === "border") replacement = '<span class="tag-border">' + selected + "</span>";
          else if (tag === "mark") replacement = "<mark>" + selected + "</mark>";
          else if (tag === "bullet") replacement = "\n• " + selected;

          textarea.value = val.substring(0, start) + replacement + val.substring(end);
          textarea.focus();
          textarea.setSelectionRange(start + replacement.length, start + replacement.length);
          textarea.dispatchEvent(new Event("input", { bubbles: true }));
        });
      });
    });
  }

  attachToolbars();
  const observer = new MutationObserver(function() {
    attachToolbars();
  });
  observer.observe(document.body, { childList: true, subtree: true });
});
</script>
